version: "3.9"  # optional since v1.27.0
services:
# mongodb service
  mongoDb:
    container_name: db_container
    image: mongo:latest
    restart: always
    volumes:
      - mongoDb:/data/db

# nodejs api
  api:
    build: .
    ports: 
      -  3000:3500  # 3000 on local to 3500 in docker
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongoDb:27017
      DB_NAME: fido_db
    depends_on:
      - mongoDb
     
volumes:
  mongoDb: {}